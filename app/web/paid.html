<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Оплата принята</title>
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #f5f7fb; color: #1b1f2a;

    .card { background: #fff; border-radius: 20px; padding: 32px 24px; max-width: 380px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    .ok { font-size: 56px; }
    h1 { font-size: 22px; margin: 8px 0 12px; }
    p { line-height: 1.5; color: #4a5160; }
    a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 12px; background: #1F3A93; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ok">✅</div>
    <h1>Спасибо! Оплата принята</h1>
    <p>Вернитесь в приложение секции — занятия зачислятся в течение минуты.</p>
    <p>Чек придёт на вашу почту.</p>
    <a href="./">Открыть веб-версию</a>
  </div>

</html>
