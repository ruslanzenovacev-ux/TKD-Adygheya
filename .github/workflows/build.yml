# Сборка и выпуск приложения.
#
# • Каждый push в main: тесты сервера и приложения, сборка APK и веб-версии (скачать — во вкладке Actions → Artifacts).
# • Выпуск новой версии для всех: Actions → «Сборка и выпуск» → Run workflow → отметить «Выпустить».
#   APK, веб-версия и version.json выкладываются в Yandex Object Storage — приложения у родителей
#   увидят новую версию и предложат обновиться.
#
# Настройки репозитория (Settings → Secrets and variables → Actions):
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS — ключ подписи APK
#              YC_SA_KEY_JSON, YC_FOLDER_ID — доступ к Yandex Cloud (адрес API и выкладка берутся оттуда автоматически)
#   Variables (необязательно): PRIVACY_URL, CLUB_NAME, MIN_BUILD, YC_BUCKET (по умолчанию tkdadygea01-app),
#              API_URL (если нужно переопределить адрес сервера)

name: Сборка и выпуск

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить новую версию для всех пользователей'
        type: boolean
        default: false
      notes:
        description: 'Что нового (увидят пользователи)'
        type: string
        default: ''
      required:
        description: 'Обязательное обновление (старые версии не смогут работать без обновления)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  backend:
    name: Сервер — тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  app:
    name: Приложение — сборка
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      YC_BUCKET: ${{ vars.YC_BUCKET || 'tkdadygea01-app' }}
      YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Yandex Cloud — адрес сервера
        id: yc
        run: |
          if [ -z "$YC_SA_KEY_JSON" ] || [ -z "$YC_FOLDER_ID" ]; then
            echo "::notice::Yandex Cloud не подключён — приложение будет смотреть на тестовый сервер."
            exit 0
          fi
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n >/dev/null
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
          printf '%s' "$YC_SA_KEY_JSON" > "$RUNNER_TEMP/sa.json"
          "$HOME/yc/bin/yc" config profile create ci >/dev/null
          "$HOME/yc/bin/yc" config set service-account-key "$RUNNER_TEMP/sa.json"
          "$HOME/yc/bin/yc" config set folder-id "$YC_FOLDER_ID"
          DOMAIN=$("$HOME/yc/bin/yc" serverless api-gateway get --name tkd-gw --format json 2>/dev/null | jq -r '.domain // empty' || true)
          if [ -n "$DOMAIN" ]; then
            echo "api_url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "Сервер: https://$DOMAIN"
          else
            echo "::warning::Сервер ещё не развёрнут — сначала запустите «Развёртывание сервера»."
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Подготовка проекта
        # Создаёт недостающие служебные файлы Flutter (gradle, иконки). Наши файлы не перезаписываются.
        run: |
          flutter --version
          flutter create --org ru.tkdclub --project-name tkd_app --platforms android,web .
          flutter pub get

      - name: Проверка кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Тесты
        run: flutter test

      - name: Номер версии
        id: ver
        run: |
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          SITE="https://${YC_BUCKET}.website.yandexcloud.net"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "Версия $VERSION (сборка $BUILD)"

      - name: Сборка APK
        run: |
          UPDATE_URL=""
          [ -n "${{ steps.ver.outputs.site }}" ] && UPDATE_URL="${{ steps.ver.outputs.site }}/version.json"
          flutter build apk --release \
            --build-name "${{ steps.ver.outputs.version }}" \
            --build-number "${{ steps.ver.outputs.build }}" \
            --dart-define=API_URL="${{ vars.API_URL || steps.yc.outputs.api_url }}" \
            --dart-define=UPDATE_URL="$UPDATE_URL" \
            --dart-define=APP_BUILD="${{ steps.ver.outputs.build }}" \
            --dart-define=APP_VERSION="${{ steps.ver.outputs.version }}" \
            --dart-define=PRIVACY_URL="${{ vars.PRIVACY_URL }}" \
            --dart-define=CLUB_NAME="${{ vars.CLUB_NAME || 'Тхэквондо' }}"

      - name: Подпись APK постоянным ключом
        # Обновление поверх установленной версии возможно, только если все версии подписаны одним ключом.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p dist
          OUT="dist/tkd-${{ steps.ver.outputs.version }}.apk"
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Ключ подписи не настроен — APK подписан временным ключом и годится только для проверки."
            cp "$SRC" "$OUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$OUT" "$SRC"
            "$APKSIGNER" verify --print-certs "$OUT" | head -3
            rm -f "$RUNNER_TEMP/release.jks"
          fi
          sha256sum "$OUT" | cut -d' ' -f1 > dist/apk.sha256
          ls -la dist

      - name: Сборка веб-версии (для iPhone)
        run: |
          UPDATE_URL=""
          [ -n "${{ steps.ver.outputs.site }}" ] && UPDATE_URL="${{ steps.ver.outputs.site }}/version.json"
          flutter build web --release --base-href /web/ \
            --dart-define=API_URL="${{ vars.API_URL || steps.yc.outputs.api_url }}" \
            --dart-define=UPDATE_URL="$UPDATE_URL" \
            --dart-define=APP_BUILD="${{ steps.ver.outputs.build }}" \
            --dart-define=APP_VERSION="${{ steps.ver.outputs.version }}" \
            --dart-define=PRIVACY_URL="${{ vars.PRIVACY_URL }}" \
            --dart-define=CLUB_NAME="${{ vars.CLUB_NAME || 'Тхэквондо' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tkd-${{ steps.ver.outputs.version }}-android
          path: app/dist/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: tkd-${{ steps.ver.outputs.version }}-web
          path: app/build/web
          retention-days: 7

      - name: Выпуск для пользователей
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AWS_DEFAULT_REGION: ru-central1
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          REQUIRED: ${{ inputs.required }}
          MIN_BUILD_VAR: ${{ vars.MIN_BUILD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Нельзя выпускать без постоянного ключа подписи"; exit 1; }
          [ -f "$RUNNER_TEMP/sa.json" ] || { echo "::error::Не подключён Yandex Cloud (секреты YC_SA_KEY_JSON / YC_FOLDER_ID)"; exit 1; }
          [ -n "${{ steps.yc.outputs.api_url }}${{ vars.API_URL }}" ] || { echo "::error::Сервер не развёрнут — приложение не будет работать"; exit 1; }

          # Временный ключ для записи в хранилище: создаётся на время выпуска и сразу удаляется.
          SA_ID=$(jq -r .service_account_id "$RUNNER_TEMP/sa.json")
          KEY_JSON=$(yc iam access-key create --service-account-id "$SA_ID" --description "release $GITHUB_RUN_NUMBER" --format json)
          KEY_ID=$(echo "$KEY_JSON" | jq -r .access_key.id)
          export AWS_ACCESS_KEY_ID=$(echo "$KEY_JSON" | jq -r .access_key.key_id)
          export AWS_SECRET_ACCESS_KEY=$(echo "$KEY_JSON" | jq -r .secret)
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          trap 'yc iam access-key delete --id "$KEY_ID" >/dev/null || true' EXIT
          sleep 5
          S3="aws s3 --endpoint-url https://storage.yandexcloud.net"
          VERSION="${{ steps.ver.outputs.version }}"
          BUILD="${{ steps.ver.outputs.build }}"
          SITE="${{ steps.ver.outputs.site }}"
          APK="dist/tkd-$VERSION.apk"

          if [ "$REQUIRED" = "true" ]; then MIN_BUILD="$BUILD"; else MIN_BUILD="${MIN_BUILD_VAR:-0}"; fi

          # 1. APK: версия с номером (для автообновления) и «последняя» (ссылка для первой установки).
          $S3 cp "$APK" "s3://$YC_BUCKET/apk/tkd-$VERSION.apk" --content-type application/vnd.android.package-archive
          $S3 cp "$APK" "s3://$YC_BUCKET/apk/tkd-latest.apk" --content-type application/vnd.android.package-archive --cache-control no-cache

          # 2. Веб-версия. Служебные файлы — без кэша, чтобы iPhone сразу получал новую версию.
          $S3 sync build/web "s3://$YC_BUCKET/web" --delete --exclude index.html --exclude flutter_bootstrap.js --exclude main.dart.js --exclude flutter_service_worker.js --exclude version.json
          for f in index.html flutter_bootstrap.js main.dart.js flutter_service_worker.js version.json; do
            [ -f "build/web/$f" ] && $S3 cp "build/web/$f" "s3://$YC_BUCKET/web/$f" --cache-control no-cache
          done

          # 3. version.json — последним, когда всё уже на месте.
          jq -n --arg version "$VERSION" --argjson build "$BUILD" --argjson minBuild "$MIN_BUILD" \
                --arg apkUrl "$SITE/apk/tkd-$VERSION.apk" --arg sha256 "$(cat dist/apk.sha256)" --arg notes "$NOTES" \
                '{version:$version, build:$build, minBuild:$minBuild, apkUrl:$apkUrl, sha256:$sha256, notes:$notes}' > dist/version.json
          cat dist/version.json
          $S3 cp dist/version.json "s3://$YC_BUCKET/version.json" --content-type application/json --cache-control no-cache

          # 4. Релиз на GitHub — история версий.
          cd ..
          gh release create "v$VERSION" "app/$APK" --title "Версия $VERSION" --notes "${NOTES:-Без описания}"

          {
            echo "### Выпущена версия $VERSION"
            echo "- Скачать APK: $SITE/apk/tkd-latest.apk"
            echo "- Веб-версия для iPhone: $SITE/web/"
            echo "- Обязательное обновление: $REQUIRED (minBuild=$MIN_BUILD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Удалить ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
